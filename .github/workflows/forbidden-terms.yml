name: Forbidden terms

# Pull requests from forks never receive secrets under `pull_request`, so the
# check would fail for every outside contributor. `pull_request_target` runs with
# the secret, which is safe here only because of one rule: the scanner always
# comes from the base branch, and the pull request's files are read as data.
# Nothing from the pull request is installed, built or executed.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, next]

permissions:
  contents: read

jobs:
  scan:
    name: forbidden-terms
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Under pull_request_target, GitHub attaches this job's result to the base branch's
      # commit, not the pull request's. The last step posts it on the pull request's own
      # commit, which is where branch protection looks for the required check.
      statuses: write
    steps:
      - name: Check out the trusted scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          persist-credentials: false

      - name: Check out the code to scan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: trusted/.nvmrc

      - name: Scan files and commit messages
        id: scan
        env:
          PEER_AI_FORBIDDEN_TERMS: ${{ secrets.PEER_AI_FORBIDDEN_TERMS }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request_target" ]; then
            git -C target fetch --quiet --no-tags "https://github.com/$REPO" "$PR_BASE"
            range="$PR_BASE..$PR_HEAD"
          else
            # On a push, every commit message in the branch's history. A range from the previous
            # head breaks after a force-push, when that commit no longer exists.
            range="$PUSH_HEAD"
          fi
          node trusted/scripts/check-forbidden-terms.ts --root target --range "$range"

      - name: Report the result on the pull request's commit
        if: ${{ always() && github.event_name == 'pull_request_target' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          OUTCOME: ${{ steps.scan.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            state=success
            description="No forbidden terms found"
          else
            state=failure
            description="Forbidden terms found, or the scan could not complete"
          fi
          gh api "repos/$REPO/statuses/$PR_HEAD" \
            -f state="$state" -f context=forbidden-terms -f description="$description" -f target_url="$RUN_URL" \
            --silent
