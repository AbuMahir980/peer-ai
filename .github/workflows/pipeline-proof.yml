name: Pipeline proof

# Runs the github-actions stack profile's tools on every rule's failing and passing examples, and
# on the workflow render writes (RFC 0006). The tools and the advisories they read change without
# a change here, so it also runs every week.

on:
  pull_request:
    paths:
      - packages/peer-ai/src/pipeline.ts
      - packages/standards/src/profiles/github-actions.ts
      - scripts/pipeline-proof.ts
      - .github/workflows/pipeline-proof.yml
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  prove:
    name: prove
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/pipeline-proof.ts
