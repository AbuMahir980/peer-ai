version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    versioning-strategy: increase
    ignore:
      # typescript-eslint doesn't support TypeScript 7 yet, so lint fails on it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node's types follow the Node version in .nvmrc, not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
