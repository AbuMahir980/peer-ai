name: Workflow defect
description: A phase, skill, rule or template misled you, contradicted itself, or could not be followed on your project.
title: "[defect] "
labels: ["workflow-defect"]
body:
  - type: markdown
    attributes:
      value: |
        **The test for an entry:** would this bite anyone using Peer AI, on any project?
        If it only concerns your own project's customisation, it belongs in your repo.

        Please use neutral descriptions, not the names of clients or private projects.

  - type: input
    id: where
    attributes:
      label: Where
      description: The file, skill or command, and the step or section inside it.
      placeholder: "frontend/03-build.md, step 4 'Mock data layer'"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: What it says, and what went wrong when it was followed. Quote the line, and say what an agent following it literally would do.
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: Proposed wording, or the shape of the change. A rough fix is fine.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "fix: a user will hit this"
        - "polish: cosmetic, or two files that disagree"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The package version, or for v0 the commit you copied from.
      placeholder: "v0.1.0"

  - type: textarea
    id: shape
    attributes:
      label: Project shape
      description: >
        Stack and platform, whether there is a backend or an API, whether the design already existed,
        and whether the project was new or existing. Most defects so far only showed up on a project
        of a different shape.
      placeholder: "React Native on Expo, existing backend with an OpenAPI file, designs already drawn"
    validations:
      required: true
